name: Testing

on:
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [26]

        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: recursive
            - uses: emscripten-core/setup-emsdk@v16
              with:
                  version: 6.0.4
                  actions-cache-folder: emsdk-cache
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm ci
            - run: npm run lint:nofix
            - run: npm run build:wasm
            # build:wasm regenerates the bindings from the Lua headers, so a difference here means the
            # committed file was edited by hand or left behind by a change to the generator.
            - run: git diff --exit-code src/bindings.gen.ts
            - run: npm run build
            - run: npx playwright install --with-deps chromium
            - run: npm test
            - run: npm run luatests
